@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--purple:#7657cc;--ink:#272339;--muted:#7c788b}
body{font-family:Manrope,-apple-system,BlinkMacSystemFont,sans-serif;background:radial-gradient(ellipse 90% 35% at 85% -8%,#e9dcff 0%,transparent 100%),#f6f5fa;color:var(--ink)}
main{max-width:510px;padding:26px 19px 126px}
header{padding:5px 1px 16px;margin-bottom:16px;border-bottom:1px solid #e7e3ee}

.card.hero:after{content:"✦";position:absolute;color:#e0cffb;right:25px;top:22px;font-size:27px}
.hero h1{position:relative;z-index:1;font-size:31px;max-width:280px}

.tag{color:#d6c3ff;font-weight:800;font-size:11px;letter-spacing:1.45px;position:relative;z-index:1;display:block;margin-bottom:11px}
.bar{background:#eee9f6;height:9px}
.hero .bar{background:#ffffff38;position:relative;z-index:1}
.fill{background:linear-gradient(90deg,#a78dfc,#debcff);transition:width .25s}
.card:not(.hero) .fill{background:#7657cc}
.task{gap:14px;align-items:flex-start}.step{width:39px;height:39px;border-radius:14px;background:linear-gradient(145deg,#f3edff,#e6dcff);color:#6a46ba;font-size:16px}

button.alt,.btn.alt{background:#f1ebfc;color:#6242ae;box-shadow:none}
nav{max-width:490px;bottom:12px;border:1px solid #ebe7f2;border-radius:22px;box-shadow:0 8px 40px #25133825;padding:8px 8px max(8px,env(safe-area-inset-bottom));background:#fffffff2;backdrop-filter:blur(18px);gap:3px}

nav button.active{background:#f0e9ff;color:#6b47c3}
input,select{border:1px solid #e1dbea;border-radius:13px;padding:14px;outline:none}
input:focus,select:focus{border-color:#805ce0;box-shadow:0 0 0 3px #805ce01b}
