<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#39295c"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>Твоя Каррера</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f7fb;color:#262235;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:510px;margin:auto;padding:22px 18px 100px}header{display:flex;align-items:center;gap:12px;margin-bottom:25px}.avatar{border-radius:17px;background:#eee7ff;padding:12px;font-size:28px}header strong{font-size:22px}.muted,small{color:#777184;font-size:13px}h1{font-size:29px;line-height:1.15;margin:0 0 9px}h2{font-size:19px;margin:3px 0 12px}.card{border-radius:20px;background:white;border:1px solid #eae6f0;padding:19px;margin:14px 0;box-shadow:0 8px 25px #1a103007}.hero{background:#44306f;color:white;border:0}.hero p{color:#e1d6fa}.tag{color:#bdacfc;font-size:12px;font-weight:750;letter-spacing:.6px}.task{display:flex;gap:12px}.step{flex-shrink:0;display:grid;place-items:center;background:#eee8fe;color:#6440bd;width:33px;height:33px;border-radius:11px;font-weight:800}.task b{display:block}.task p{color:#777184;line-height:1.45;font-size:13px;margin:7px 0}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button,.btn{background:#6849bd;color:white;border:0;border-radius:12px;padding:11px 13px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}button.alt,.btn.alt{background:#eee8fc;color:#6042aa}button:disabled{opacity:.5}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,510px);display:flex;justify-content:space-around;background:white;border-top:1px solid #eae5ef;padding:10px 1px max(15px,env(safe-area-inset-bottom))}nav button{background:transparent;color:#777184;padding:10px 8px}nav button.active{color:#6042aa}label{font-size:14px;font-weight:650}input,select{display:block;width:100%;margin:7px 0 17px;padding:12px;border:1px solid #dcd5e8;background:white;border-radius:12px;font:inherit}.bar{height:9px;background:#eee9f4;border-radius:15px;overflow:hidden}.fill{height:100%;background:#9475e6}.fine{font-size:12px;color:#888192}.done{color:#25845f;font-weight:700}.hidden{display:none}
</style></head><body><main><header><div class="avatar">🐱</div><div><strong>Твоя Каррера</strong><div class="muted">Маленькие шаги к новой работе</div></div></header><section id="view"></section></main><nav id="nav" class="hidden"><button id="nav-today" onclick="go('today')">Сегодня</button><button id="nav-plan" onclick="go('plan')">План</button><button id="nav-progress" onclick="go('progress')">Прогресс</button><button id="nav-coach" onclick="go('coach')">Каррера</button></nav><script>
const key='tvoya-karrera-demo-v1';let s;try{s=JSON.parse(localStorage.getItem(key)||'null')||{}}catch{s={}}let page='today';const lessons=[
[['Найди три интересные компании','Начни с поиска компаний, в которых хотел бы работать.','https://www.linkedin.com/search/results/companies/'],['Подпишись на одну компанию','Так ты увидишь её новости и новые вакансии.','https://www.linkedin.com/feed/'],['Сохрани подходящую вакансию','Пока не откликайся: изучи требования.','https://www.linkedin.com/jobs/']],
[['Проверь заголовок профиля','В одной строке укажи свою роль и сильную сторону.','https://www.linkedin.com/in/'],['Найди двух специалистов в своей сфере','Посмотри, как они представляют себя.','https://www.linkedin.com/search/results/people/'],['Выбери ключевые навыки','Сравни навыки из вакансий со своим профилем.','https://www.linkedin.com/jobs/']],
[['Прочитай публикацию в своей сфере','Найди тему, в которой действительно разбираешься.','https://www.linkedin.com/feed/'],['Напиши один осмысленный комментарий','Добавь собственный опыт, а не шаблонную похвалу.','https://www.linkedin.com/feed/'],['Посмотри две подходящие вакансии','Запиши, какие требования повторяются.','https://www.linkedin.com/jobs/']],
[['Найди одного рекрутера','Выбери специалиста по подбору в интересной компании.','https://www.linkedin.com/search/results/people/'],['Подготовь короткое приглашение','Представься и объясни, почему интересна компания.','https://www.linkedin.com/mynetwork/'],['Проверь раздел «О себе»','Он должен показывать, какую задачу ты умеешь решать.','https://www.linkedin.com/in/']]
];const escapeHtml=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(key,JSON.stringify(s))}function current(){return Math.max(1,Math.min(30,Number(s.day)||1))}function tasks(d){return lessons[(d-1)%lessons.length]}function completed(d){return tasks(d).filter((_,i)=>s.done?.[d+'-'+i]).length}function go(p){page=p;render()}function mark(d,i){s.done=s.done||{};s.done[d+'-'+i]=!s.done[d+'-'+i];save();render()}function next(){if(completed(current())<3)return;s.day=Math.min(30,current()+1);save();render()}function setup(){s.name=document.getElementById('name').value.trim();s.role=document.getElementById('role').value.trim();s.goal=document.getElementById('goal').value;s.day=1;s.done={};save();render()}
function render(){const v=document.getElementById('view'),n=document.getElementById('nav');if(!s.name){n.classList.add('hidden');v.innerHTML='<div class="card hero"><div class="tag">ПЕРВЫЙ ШАГ</div><h1>Найди работу увереннее</h1><p>Каждый день — три понятных действия в LinkedIn. Каррера покажет, с чего начать.</p></div><div class="card"><h2>Давай познакомимся</h2><label>Как тебя зовут?<input id="name" placeholder="Имя"></label><label>Какая у тебя профессия?<input id="role" placeholder="Например, маркетолог"></label><label>Что сейчас важнее?<select id="goal"><option value="new">Найти новую работу</option><option value="first">Найти первую работу</option><option value="change">Сменить профессию</option></select></label><button onclick="setup()">Начать программу</button><p class="fine">Демо: данные сохраняются только в этом браузере. Это не вход через LinkedIn.</p></div>';return}n.classList.remove('hidden');for(const p of ['today','plan','progress','coach'])document.getElementById('nav-'+p).classList.toggle('active',page===p);const d=current(),count=completed(d);if(page==='today'){v.innerHTML='<div class="card hero"><div class="tag">ДЕНЬ '+d+' ИЗ 30</div><h1>Привет, '+escapeHtml(s.name)+'!</h1><p>Не нужно искать работу целый день. Начни с трёх небольших шагов.</p><div class="bar"><div class="fill" style="width:'+(count/3*100)+'%"></div></div><p>'+count+' из 3 заданий выполнено</p></div><h2>План на сегодня</h2>'+tasks(d).map(([title,desc,url],i)=>'<div class="card"><div class="task"><div class="step">'+(s.done?.[d+'-'+i]?'✓':i+1)+'</div><div><b>'+title+'</b><p>'+desc+'</p><div class="actions"><a class="btn alt" target="_blank" rel="noopener noreferrer" href="'+url+'">Открыть LinkedIn ↗</a><button onclick="mark('+d+','+i+')">'+(s.done?.[d+'-'+i]?'Отменить':'Выполнено')+'</button></div></div></div></div>').join('')+(count===3?'<div class="card"><h2>Отлично, день завершён!</h2><p>Ты сделал три полезных действия. Продолжим?</p><button onclick="next()">Следующий день →</button></div>':'<p class="fine">Переход к следующему дню доступен после выполнения всех трёх заданий.</p>')}else if(page==='plan'){v.innerHTML='<h1>Твой план</h1><p class="muted">30 дней небольших действий в LinkedIn</p>'+Array.from({length:30},(_,i)=>'<div class="card"><b>День '+(i+1)+'</b> <span class="muted">· '+(i+1===d?'Сегодня':i+1<d?'Пройден':'Впереди')+'</span><p class="muted">'+tasks(i+1).map(x=>x[0]).join(' · ')+'</p></div>').join('')}else if(page==='progress'){const total=Array.from({length:30},(_,i)=>completed(i+1)).reduce((a,b)=>a+b,0);v.innerHTML='<h1>Твой прогресс</h1><div class="card"><div style="font-size:38px;font-weight:850">'+total+'</div><p>Выполненных действий</p><div class="bar"><div class="fill" style="width:'+(total/90*100)+'%"></div></div><p class="muted">Программа из 90 действий за 30 дней</p></div><div class="card"><h2>Главное — регулярность</h2><p>Не измеряй успех только ответами рекрутеров. Сегодня ты можешь улучшить то, что зависит от тебя.</p></div>'}else{v.innerHTML='<h1>Каррера рядом 🐱</h1><div class="card hero"><h2>Совет дня</h2><p>'+(['Делай меньше случайных откликов и больше осмысленных действий.','Хороший профиль объясняет не только, кем ты работал, но и что умеешь.','Не отправляй одинаковые сообщения всем подряд.','Отсутствие ответа — повод проверить подход, а не отказаться от цели.'][(d-1)%4])+'</p></div><div class="card"><h2>Что дальше?</h2><p>Открой «Сегодня», чтобы выполнить три задания. Это первая версия наставника: полноценный ИИ-чат добавим позже.</p><button class="alt" onclick="go(\'today\')">К заданиям</button></div>'}}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
