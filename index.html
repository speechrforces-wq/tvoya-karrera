.stats strong{font-size:24px}.stats span{font-size:10px}
.sectionline{margin:24px 0 13px}.sectionline h2{font-size:26px}

.mission:last-child{border:1px solid #ece8ef}

.coach-figure{background:#eee1fb;border-radius:24px;overflow:hidden}
.coach-figure img{mix-blend-mode:normal}

const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const day=()=>Math.max(1,Math.min(30,Number(data.day)||1));const tasks=d=>catalog[(d-1)%4];const done=(d,i)=>!!data.done?.[d+'-'+i];const count=d=>tasks(d).filter((_,i)=>done(d,i)).length;function save(){localStorage.setItem(KEY,JSON.stringify(data))}function go(x){view=x;render();window.scrollTo({top:0})}function task(i){selected=i;go('task')}function toggle(){const d=day();data.done=data.done||{};data.done[d+'-'+selected]=!done(d,selected);save();go('home')}function next(){if(count(day())===3&&day()<30){data.day=day()+1;save();go('home')}}function start(){data.name=document.getElementById('name').value.trim()||'Друг';data.role=document.getElementById('role').value.trim()||'Специалист';data.goal=document.getElementById('goal').value;data.done=data.done||{};data.day=data.day||1;save();go('home')}
function home(){const d=day();return '<div class="intro"><span class="eyebrow">ДЕНЬ '+String(d).padStart(2,'0')+' · ТВОЙ ПУТЬ</span><h1>Привет,<br><i>'+esc(data.name)+'!</i></h1><p class="sub">Не ищи работу вслепую. Делай три осмысленных шага каждый день.</p><div class="cat-stage"><img alt="Кошка Каррера" src="'+ART+'"></div><div class="scribble">«Всё получится. Начнём с малого!»</div></div><div class="stats"><div><strong>'+count(d)+'/3</strong><span>сегодня</span></div><div><strong>'+Math.min(d,30)+'/30</strong><span>день курса</span></div><div><strong>'+Object.values(data.done||{}).filter(Boolean).length+'</strong><span>всего шагов</span></div></div><div class="sectionline"><h2>Сегодня<br>в деле.</h2><small>10–15 минут</small></div>'+tasks(d).map((t,i)=>'<div class="mission '+(done(d,i)?'done':'')+'"><div class="num">'+String(i+1).padStart(2,'0')+'</div><div><b>'+esc(t[0])+'</b><p>'+esc(t[1])+'</p></div><button class="circle" aria-label="Открыть задание" onclick="task('+i+')">'+(done(d,i)?'✓':'↗')+'</button></div>').join('')+(count(d)===3?'<div class="controls"><button class="solid purple" onclick="next()">Следующий день →</button></div>':'')+'<div class="tip"><h3>Совет от Карреры</h3><p>Делай реальные действия, а не собирай галочки. Здесь важен каждый полезный контакт.</p></div>'}
function detail(){const t=tasks(day())[selected];return '<button class="outline" onclick="go(\'home\')">← Назад</button><div class="page-head"><span class="eyebrow">ДЕНЬ '+day()+' / ЗАДАНИЕ '+(selected+1)+'</span><h1>'+esc(t[0])+'</h1></div><div class="task-ill"><img alt="Каррера" src="'+ART+'"></div><p class="bigdesc">'+esc(t[1])+'</p><ol class="steps"><li>Открой LinkedIn по ссылке ниже.</li><li>Выполни действие самостоятельно.</li><li>Вернись и отметь выполнение.</li></ol><div class="controls"><a class="solid purple" href="'+t[2]+'" target="_blank" rel="noopener noreferrer">Открыть LinkedIn ↗</a><button class="outline" onclick="toggle()">'+(done(day(),selected)?'Отменить':'Готово ✓')+'</button></div>'}
function plan(){return '<div class="page-head"><span class="eyebrow">ТВОЙ МАРШРУТ</span><h1>30 дней.<br>Новый ритм.</h1></div><p class="bigdesc">Постепенно превращаем LinkedIn в понятный инструмент для поиска работы.</p><div class="timeline">'+Array.from({length:30},(_,i)=>'<div class="milestone '+(i+1===day()?'current':'')+'"><strong>День '+String(i+1).padStart(2,'0')+'</strong><p>'+esc(tasks(i+1).map(t=>t[0]).join(' · '))+'</p></div>').join('')+'</div>'}
function progress(){let n=Object.values(data.done||{}).filter(Boolean).length;return '<div class="page-head"><span class="eyebrow">ПОСТОЯНСТВО ВАЖНЕЕ СПЕШКИ</span><h1>Ты уже<br>в движении.</h1></div><div class="stats"><div><strong>'+n+'</strong><span>завершено</span></div><div><strong>'+day()+'</strong><span>текущий день</span></div><div><strong>'+Math.floor(n/3)+'</strong><span>полных дней</span></div></div><div class="quote">«Большие изменения начинаются с маленьких действий».</div><div class="coach-figure"><img src="'+ART+'" alt="Каррера"></div><div class="tip"><h3>Продолжаем?</h3><p>Хорошие привычки складываются постепенно. Даже если рекрутеры пока молчат, ты можешь улучшить свои действия.</p></div>'}
function coach(){return '<div class="page-head"><span class="eyebrow">ТВОЙ НАПАРНИК</span><h1>Каррера<br>рядом.</h1></div><div class="coach-figure"><img src="'+ART+'" alt="Каррера"></div><p class="quote">«Не нужно быть идеальным кандидатом. Нужно научиться показывать свои сильные стороны».</p><p class="bigdesc">Я помогаю двигаться маленькими шагами и не теряться в LinkedIn. Полноценные персональные ответы ИИ появятся в следующих версиях.</p><div class="controls"><button class="solid purple" onclick="go(\'home\')">К заданиям →</button></div>'}
function onboarding(){return '<div class="onboard"><div class="intro"><span class="eyebrow">НАЧНИ СЕГОДНЯ</span><h1>Твоя<br><i>Каррера.</i></h1><p class="sub">Три полезных шага каждый день. Всё остальное — потом.</p><div class="cat-stage"><img src="'+ART+'" alt="Кошка Каррера"></div></div><div class="sectionline"><h2>Давай<br>знакомиться.</h2></div><label class="field">Твоё имя<input id="name" placeholder="Как тебя зовут?"></label><label class="field">Профессия<input id="role" placeholder="Например, маркетолог"></label><label class="field">Твоя цель<select id="goal"><option>Найти новую работу</option><option>Найти первую работу</option><option>Сменить сферу</option></select></label><div class="controls"><button class="solid purple" onclick="start()">Начать путь →</button></div><p style="color:#706a72;font-size:11px;line-height:1.5">Это демоверсия. Информация хранится в браузере устройства; LinkedIn и ИИ пока не подключены.</p></div>'}
function render(){document.getElementById('daypill').textContent='День '+String(day()).padStart(2,'0')+' / 30';const nav=document.getElementById('nav');if(!data.name){nav.classList.add('hidden');document.getElementById('view').innerHTML=onboarding();return}nav.classList.remove('hidden');document.getElementById('view').innerHTML=({home,task:detail,plan,progress,coach}[view]||home)();for(const k of ['home','plan','progress','coach'])document.getElementById('n-'+k).classList.toggle('active',view===k||(view==='task'&&k==='home'))}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
